# Example for `docker compose` or a TrueNAS "Install via YAML" custom app.
services:
  gtrmnl:
    image: ghcr.io/rounndel/gtrmnl:0.1.0   # pin a release tag
    restart: unless-stopped
    user: "568:568"                         # owner of the /data dataset
    environment:
      TZ: Europe/Warsaw
      INTERVAL_MINUTES: "15"
      # Prefer the _FILE variant so the URL is not visible in `docker inspect`:
      TRMNL_WEBHOOK_URL_FILE: /data/webhook_url
      # TRMNL_WEBHOOK_URL: https://trmnl.com/api/custom_plugins/<uuid>
      # Garmin login without a shell (optional, see README "Garmin login"):
      # GARMIN_TOKENS_FILE: /run/secrets/garmin_tokens.json  # tokens from `gtrmnl login`
      # GARMIN_EMAIL: you@example.com                         # or a password login,
      # GARMIN_PASSWORD_FILE: /run/secrets/garmin_password
      # With MFA by email/SMS: the first start exits after Garmin sends a code;
      # add it here and start again.
      # GARMIN_MFA_CODE: "123456"
      # Or, for an authenticator app, its secret (fully unattended):
      # GARMIN_TOTP_SECRET_FILE: /run/secrets/garmin_totp
    volumes:
      - /mnt/tank/apps/gtrmnl:/data         # host-path dataset
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No ports: the collector only makes outbound HTTPS requests.
