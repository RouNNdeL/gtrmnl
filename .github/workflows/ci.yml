name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (hash-pinned)
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: ruff check src tests trmnl/tools
      - run: ruff format --check src tests trmnl/tools
      - run: pytest
      - name: Fixtures are up to date
        run: |
          python trmnl/tools/make_fixtures.py
          git diff --exit-code trmnl/fixtures
